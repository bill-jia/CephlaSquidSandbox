version: 3.0

# ============================================================
# Squid+  +  Lumencor LDI laser engine (serial-only control)
#        +  CrestOptics X-Light V3 spinning disk
#        +  Tucsen Aries 6506 main camera
#        +  Laser autofocus (Daheng MER2-630-60U3M focus camera)
#
# Ported from the legacy Squid_XLightV3 fork's
# configuration_Squid+_Tucsen_LDI_XLight.ini.
#
# Illumination routing on this rig:
#   * LDI intensity AND shutter are driven over the LDI's own serial
#     link (LDI INT_MODE=PC / SH_MODE=PC).  No Teensy DAC and no TTL
#     strobe reach the lasers, and there is no NI-DAQ in this build, so
#     the LDI channels declare no io: lines at all.
#   * The LED matrix and the laser-AF gate are Teensy/MCU driven.
#   * The MCU cannot gate the LDI, so the camera trigger's
#     control_illumination strobe is a no-op for the lasers.  In Software
#     trigger mode (the default) the serial shutter is opened per capture;
#     in Hardware trigger mode it is simply held open for the whole
#     live/capture window (no per-frame strobe).  Per-frame TTL strobing
#     needs SH_MODE=EXT plus a TTL line from the MCU or an NI-DAQ.
# ============================================================

devices:

  teensy:
    driver: teensy
    connection:
      # Legacy ini: controller_sn = "16821080".  Required on this rig: Windows
      # labels every USB CDC device "Microsoft", so the LDI also matches the
      # microcontroller port scan.
      serial_number: "16821080"
    config:
      # Legacy ini: illumination_intensity_factor = 1.  Only affects DAC
      # ports, which nothing uses on this rig (lasers are serial-driven).
      illumination_intensity_factor: 1.0
      output_gains:
        refdiv: false
        channels: [false, false, false, false, false, false, false, true]

  # No NI-DAQ on this rig.  Kept disabled so fast-acquisition / waveform
  # features stay off and nothing tries to open Dev1.
  nidaq:
    driver: nidaq
    enabled: false
    config:
      device_name: "Dev1"

  main_camera:
    driver: tucsen
    role: main
    io:
      # Camera trigger from the Teensy (legacy Squid wiring).  Only used
      # when the trigger mode is switched to Hardware -- see header note.
      trigger:
        controller: teensy
        signal_type: digital
        direction: output
        channel_id: "trigger:0"
        display_name: "Main camera trigger (MCU)"
    config:
      model: "ARIES-6506"
      pixel_size_um: 6.5
      pixel_format: MONO16
      binning: 1
      roi: { offset_x: 0, offset_y: 0, width: 2400, height: 2400 }
      crop: { width: 2400, height: 2400 }
      rotate_angle: 0
      flip: null
      # Copied from the other Aries 6506 library configs; verify the
      # stage/image orientation on this rig.
      reverse_x: true
      reverse_y: false
      temperature: 0
      hardware_triggering_enabled: true
      readout_mode: "ROLLING"

  focus_camera:
    driver: daheng
    role: focus
    config:
      model: "MER2-630-60U3M"
      exposure_time_ms: 0.8

  stage:
    driver: cephla
    controller: teensy
    config:
      x:
        fullsteps_per_rev: 200
        screw_pitch_mm: 2.54
        microstepping: 16
        motor_rms_current_ma: 1000
        i_hold: 0.25
        max_velocity_mm: 30
        max_acceleration_mm: 500
        movement_sign: 1
        homing_enabled: true
        home_switch_polarity: 1
        scan_stabilization_time_ms: 25
      y:
        fullsteps_per_rev: 200
        screw_pitch_mm: 2.54
        microstepping: 16
        motor_rms_current_ma: 1000
        i_hold: 0.25
        max_velocity_mm: 30
        max_acceleration_mm: 500
        movement_sign: 1
        homing_enabled: true
        home_switch_polarity: 1
        scan_stabilization_time_ms: 25
      z:
        fullsteps_per_rev: 200
        screw_pitch_mm: 0.3
        microstepping: 16
        motor_rms_current_ma: 500
        i_hold: 0.5
        max_velocity_mm: 3.8
        max_acceleration_mm: 100
        movement_sign: -1
        homing_enabled: true
        home_switch_polarity: 0
        scan_stabilization_time_ms: 20
        motor_config: stepper
      encoders:
        x: { enabled: false, has_encoder: false }
        y: { enabled: false, has_encoder: false }
        z: { enabled: false, has_encoder: false }
      pid:
        x: { enabled: false }
        y: { enabled: false }
        z: { enabled: false }
      # Legacy ini [SOFTWARE_POS_LIMIT]
      software_limits:
        x: { positive: 119.5, negative: 5 }
        y: { positive: 78, negative: 2 }
        z: { positive: 6, negative: 0.05 }
      positions:
        loading: { x_mm: 0.5, y_mm: 0.5 }
        scanning: { x_mm: 20, y_mm: 20 }
        default_z_mm: 2.287

  laser_af:
    driver: laser_af
    enabled: true
    io:
      # AF laser gate = Teensy digital pin 15 (MCU_PINS.AF_LASER), exactly
      # as in the legacy fork.  Never touches the LDI.
      laser_gate:
        controller: teensy
        signal_type: digital
        direction: output
        channel_id: "pin:15"
        display_name: "laser_af_gate_mcu"
    config:
      spot_detection_mode: dual_left
      # Calibration sweep policy. The AF laser goes out and back through the
      # objective, so the spot's lateral travel per um of defocus scales with
      # magnification: distance_um is what works at reference_magnification and
      # is rescaled by reference_magnification / current magnification, clamped
      # at max_distance_um.  With distance_um 9.0 the sweep is 9 um at 20x,
      # 18 um at 10x, 4.5 um at 40x, and 30 um (clamped) at 4x.
      #
      # 10x measured 0.55 px/um on 2026-09-17, so 18 um gives ~9.9 px against
      # the 5.0 px floor.  A 6.0 base would leave 10x at ~6.6 px, which fits but
      # with little headroom.  The sweep only affects the calibration
      # measurement itself, not routine focusing, so a longer span buys a
      # better-conditioned fit; set distance_um back to 6.0 to restore exactly
      # the 20x sweep used before this was configurable.
      calibration:
        distance_um: 9.0
        reference_magnification: 20
        max_distance_um: 30.0
        positions: 5
        min_total_px: 5.0
        min_r2: 0.90
        simulation_px: 0.5

  piezo:
    driver: objective_piezo
    enabled: false
    io:
      output:
        controller: teensy
        signal_type: analog
        direction: output
        channel_id: "dac:7"
    config:
      range_um: 300
      home_um: 150
      control_voltage_range: 10
      flip_direction: false

  # Cephla/Teensy LED matrix (legacy ini: support_scimicroscopy_led_array = False)
  led_matrix:
    driver: teensy
    enabled: true
    connection:
      serial_number: null
    config:
      distance: 50
      default_na: 0.65
      turn_on_delay: 0.03
      default_color: [1, 1, 1]
      r_factor: 1.0
      g_factor: 1.0
      b_factor: 1.0

  # CrestOptics X-Light V3 spinning disk (legacy ini: enable_spinning_disk_confocal = True).
  # Protocol version (V3 @115200 vs V1/V2 @9600) is auto-detected; V3 also
  # reports which sub-units (disk motor/slider, wheels, irises) are fitted.
  xlight:
    driver: xlight
    enabled: true
    connection:
      serial_number: "A9KI1SXRA"
    config:
      sleep_time_for_wheel: 0.25
      validate_wheel_pos: false          # read the wheel back after each move
      # Seeds ObservationState.confocal_hardware_settings the first time an
      # iris is edited in the GUI.
      illumination_iris_default: 80
      emission_iris_default: 100
      # The unit's built-in emission wheel.  len(positions) is the slot count
      # the driver accepts (8 = X-Light V3, 5 = Cicero), and these names fill
      # the observation-state editor's filter-position picker.  The per-state
      # "default" position is what ObservationStateController.apply_optical_path
      # sends to xlight.set_emission_filter().  (The legacy ini's
      # xlight_emission_filter_mapping was dead code -- positions came from
      # per-channel filter_position in general.yaml, all = 1.)
      emission_filter_wheel:
        name: "XLight emission wheel"
        positions:
          1: "Quad"
          2: "Position 2"
          3: "Position 3"
          4: "Position 4"
          5: "Position 5"
          6: "Position 6"
          7: "Position 7"
          8: "Position 8"

illumination_channels_file: illumination_channel_config.yaml

# ============================================================
# ILLUMINATION DEVICES
# ============================================================

illumination_devices:

  # Lumencor LDI laser engine, serial-only (legacy ini: use_ldi_serial_control = True,
  # LDI_INTENSITY_MODE = PC, LDI_SHUTTER_MODE = PC).
  #
  # serial_key is the LDI's own line name, NOT the channel wavelength: the
  # LDI has 405 / 470 / 555 / 640 / 730 lines, and the legacy driver
  # aliased 488->470, 561->555, 638->640.  The composable illumination path
  # sends serial_key verbatim, so the alias is spelled out here.
  #
  # No io: shutter lines -- the shutter is the LDI's own (serial) shutter.
  - id: ldi
    driver: ldi
    connection:
      # Legacy driver hard-coded SN "00000001"; the builder does not pass
      # this through yet (see plan).
      serial_number: "00000001"
    config:
      intensity_mode: PC     # PC = serial 'set:' command; EXT = Squid DAC
      shutter_mode: PC       # PC = serial 'shutter:' command; EXT = TTL
    channels:
      "Fluorescence 405 nm Ex":
        wavelength_nm: 405
        type: epi_illumination
        serial_key: "405"
      "Fluorescence 488 nm Ex":
        wavelength_nm: 488
        type: epi_illumination
        serial_key: "470"
      "Fluorescence 561 nm Ex":
        wavelength_nm: 561
        type: epi_illumination
        serial_key: "555"
      "Fluorescence 638 nm Ex":
        wavelength_nm: 638
        type: epi_illumination
        serial_key: "640"
      "Fluorescence 730 nm Ex":
        wavelength_nm: 730
        type: epi_illumination
        serial_key: "730"

  - id: led_matrix
    driver: led_matrix
    config:
      unified: true
      unified_channel_name: "LED matrix"
    channels: {}

software:
  is_hcs: true
  wellplate_format: 384
  default_saving_path: "C:/Microscope_Data"
  display:
    default_crop: 85
    use_napari_for_live_view: false
    use_napari_for_mosaic: true
  acquisition:
    image_format: tif
    scaling_factor: 0.85
    dx: 0.9
    dy: 0.9
    dz: 1.5
    fovs_per_af: 3
    flexible_multipoint: true
    wellplate_multipoint: true
    recording: false
    fast_acquisition: false      # requires NI-DAQ
    default_nx: 1
    default_ny: 1
    illumination_settle_ms: 0
  autofocus:
    channel: "BF LED matrix full"
    enable_by_default: false
    bf_saving_option: "Green Channel Only"
    stop_threshold: 0.85
    crop_width: 800
    crop_height: 800
  tracking:
    enabled: false
    default_tracker: csrt
  optics:
    tube_lens_mm: 180
    inverted_objective: true
  plate_reader:
    rows: 8
    columns: 12
    row_spacing_mm: 9
    column_spacing_mm: 9
    offset_column_1_mm: 20
    offset_row_a_mm: 20
  wellplate_calibrations:
    "384":
      upper_left_x_mm: 12.41
      upper_left_y_mm: 11.18
      offset_x_mm: 0
      offset_y_mm: 0
