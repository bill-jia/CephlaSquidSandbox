version: 3.0

# ============================================================
# DEVICES -- declarative hardware inventory
# ============================================================
# Each device entry specifies:
#   driver:       registered driver name (maps to a Python class)
#   enabled:      whether to construct this device (default true)
#   simulate:     whether to use the simulation variant (default false)
#   connection:   how to reach it (serial, ethernet, USB HID, etc.)
#   config:       driver-specific parameters
#   io:           IO lines this device uses (controller + channel_id)

devices:

  # -- Low-level controllers ----------------------------------
  # These only declare connection info and controller-global settings.
  # They do NOT list available channels -- those are populated from
  # the io: blocks of every other device that references them.

  teensy:
    driver: teensy
    config:
      illumination_intensity_factor: 0.6
      output_gains:
        refdiv: false
        channels: [false, false, false, false, false, false, false, true]

  nidaq:
    driver: nidaq
    config:
      device_name: "Dev1"
      sample_rate: 100000
      # No ao_channels / do_lines here -- they are discovered from
      # the io: blocks of devices that reference nidaq.

  # -- Cameras ------------------------------------------------
  main_camera:
    driver: toupcam
    role: main
    io:
      trigger:
        controller: teensy
        signal_type: digital
        direction: output
        channel_id: "trigger:0"
    config:
      model: "ITR3CMOS26000KMA"
      pixel_format: MONO16
      binning: 2
      roi: { offset_x: 0, offset_y: 0, width: 6224, height: 4168 }
      crop: { width: 4168, height: 4168 }
      rotate_angle: null
      flip: null
      temperature: 20

  focus_camera:
    driver: daheng
    role: focus
    config:
      model: "MER2-630-60U3M"
      exposure_time_ms: 0.8

  # -- Stage ---------------------------------------------------
  stage:
    driver: cephla
    controller: teensy
    config:
      x:
        fullsteps_per_rev: 200
        screw_pitch_mm: 2.54
        microstepping: 16
        motor_rms_current_ma: 1000
        i_hold: 0.25
        max_velocity_mm: 30
        max_acceleration_mm: 500
        movement_sign: 1
        pos_sign: 1
        homing_enabled: true
        home_switch_polarity: 1
        scan_stabilization_time_ms: 25
      y:
        fullsteps_per_rev: 200
        screw_pitch_mm: 2.54
        microstepping: 16
        motor_rms_current_ma: 1000
        i_hold: 0.25
        max_velocity_mm: 30
        max_acceleration_mm: 500
        movement_sign: 1
        pos_sign: 1
        homing_enabled: true
        home_switch_polarity: 1
        scan_stabilization_time_ms: 25
      z:
        fullsteps_per_rev: 200
        screw_pitch_mm: 0.3
        microstepping: 16
        motor_rms_current_ma: 500
        i_hold: 0.5
        max_velocity_mm: 3.8
        max_acceleration_mm: 100
        movement_sign: -1
        pos_sign: -1
        homing_enabled: true
        home_switch_polarity: 0
        scan_stabilization_time_ms: 20
        motor_config: stepper
      encoders:
        x: { enabled: false, has_encoder: false }
        y: { enabled: false, has_encoder: false }
        z: { enabled: false, has_encoder: false }
      pid:
        x: { enabled: false }
        y: { enabled: false }
        z: { enabled: false }
      software_limits:
        x: { positive: 115, negative: 5 }
        y: { positive: 76, negative: 4 }
        z: { positive: 6, negative: 0.05 }
      positions:
        loading: { x_mm: 0.5, y_mm: 0.5 }
        scanning: { x_mm: 20, y_mm: 20 }
        default_z_mm: 2.287

  # illumination: block removed — channels are declared in illumination_devices below

  # Example: coolLED hybrid (serial intensity + NI-DAQ TTL shutter)
  # coolled:
  #   driver: coolled_pe400
  #   connection:
  #     serial_number: "..."
  #   channels:
  #     A:
  #       wavelength_nm: 635
  #       io:
  #         intensity:
  #           controller: serial
  #           signal_type: analog
  #           direction: output
  #           channel_id: "coolled:A"
  #         shutter:
  #           controller: nidaq
  #           signal_type: digital
  #           direction: output
  #           channel_id: "port0/line5"
  #     B:
  #       wavelength_nm: 488
  #       io:
  #         intensity:
  #           controller: serial
  #           signal_type: analog
  #           direction: output
  #           channel_id: "coolled:B"
  #         shutter:
  #           controller: nidaq
  #           signal_type: digital
  #           direction: output
  #           channel_id: "port0/line6"

  # -- Autofocus ----------------------------------------------
  laser_af:
    driver: laser_af
    enabled: true
    io:
      laser_gate:
        controller: teensy
        signal_type: digital
        direction: output
        channel_id: "pin:15"
    config:
      spot_detection_mode: dual_left

  # -- Objective piezo ----------------------------------------
  piezo:
    driver: objective_piezo
    enabled: false
    io:
      output:
        controller: teensy
        signal_type: analog
        direction: output
        channel_id: "dac:7"
    config:
      range_um: 300
      home_um: 150
      control_voltage_range: 10
      flip_direction: false

# ============================================================
# ILLUMINATION CHANNELS -- display names, calibration, LED matrix
# ============================================================
# Channel *wiring* is now in the device entries above.
# This file provides supplementary info: display names, LED matrix
# patterns, intensity calibration CSVs, excitation filter mappings.
illumination_channels_file: illumination_channel_config.yaml

# ============================================================
# ILLUMINATION DEVICES
# Composable illumination sources.  Each entry becomes one
# IlluminationDevice inside IlluminationController.  Channel
# keys must match names in illumination_channel_config.yaml.
#
# Supported drivers:
#   squid_builtin  — IO-routed lasers (MCU / NI-DAQ)
#   led_matrix     — Programmable LED array (MCU or SciMicroscopy)
#   coolled_pe400  — CoolLED pE-400 / pE-400max (serial intensity + TTL/serial shutter)
#   ldi            — Lumencor LDI light engine
#   celesta        — Lumencor CELESTA light engine
#   andor_laser    — Andor laser system
#   versalase      — VersaLase laser system
# ============================================================

illumination_devices:

  - id: squid_lasers
    driver: squid_builtin
    channels:
      "Fluorescence 405 nm Ex":
        wavelength_nm: 405
        type: epi_illumination
        io:
          intensity: { controller: teensy, signal_type: analog,  direction: output, channel_id: "port:0" }
          shutter:   { controller: teensy, signal_type: digital, direction: output, channel_id: "port:0" }
      "Fluorescence 488 nm Ex":
        wavelength_nm: 488
        type: epi_illumination
        io:
          intensity: { controller: teensy, signal_type: analog,  direction: output, channel_id: "port:1" }
          shutter:   { controller: teensy, signal_type: digital, direction: output, channel_id: "port:1" }
      "Fluorescence 561 nm Ex":
        wavelength_nm: 561
        type: epi_illumination
        io:
          intensity: { controller: teensy, signal_type: analog,  direction: output, channel_id: "port:2" }
          shutter:   { controller: teensy, signal_type: digital, direction: output, channel_id: "port:2" }
      "Fluorescence 638 nm Ex":
        wavelength_nm: 638
        type: epi_illumination
        io:
          intensity: { controller: teensy, signal_type: analog,  direction: output, channel_id: "port:3" }
          shutter:   { controller: teensy, signal_type: digital, direction: output, channel_id: "port:3" }
      "Fluorescence 730 nm Ex":
        wavelength_nm: 730
        type: epi_illumination
        io:
          intensity: { controller: teensy, signal_type: analog,  direction: output, channel_id: "port:4" }
          shutter:   { controller: teensy, signal_type: digital, direction: output, channel_id: "port:4" }

  - id: led_matrix
    driver: led_matrix
    channels:
      "BF LED matrix full":       { source_code: 0, type: transillumination }
      "DF LED matrix":            { source_code: 3, type: transillumination }
      "BF LED matrix low NA":     { source_code: 4, type: transillumination }
      "BF LED matrix left half":  { source_code: 1, type: transillumination }
      "BF LED matrix right half": { source_code: 2, type: transillumination }
      "BF LED matrix top half":   { source_code: 7, type: transillumination }
      "BF LED matrix bottom half":{ source_code: 8, type: transillumination }

# Example: CoolLED pE-400 (serial intensity) with NI-DAQ TTL shutter
# Uncomment and adjust to add a CoolLED alongside the squid_lasers above.
