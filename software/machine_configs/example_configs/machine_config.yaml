# ============================================================
# SOFTWARE / GUI SETTINGS
# ============================================================
software:
  is_hcs: true
  wellplate_format: 384
  default_saving_path: "/Downloads"
  display:
    default_crop: 85
    use_napari_for_live_view: false
    use_napari_for_mosaic: true
  acquisition:
    image_format: bmp
    scaling_factor: 0.85
    dx: 0.9
    dy: 0.9
    dz: 1.5
    fovs_per_af: 3
    flexible_multipoint: true
    wellplate_multipoint: false
    recording: true
    fast_acquisition: true
    default_nx: 1
    default_ny: 1
  autofocus:
    channel: "BF LED matrix full"
    enable_by_default: false
    bf_saving_option: "Green Channel Only"
    stop_threshold: 0.85
    crop_width: 800
    crop_height: 800
  tracking:
    enabled: false
    default_tracker: csrt
  optics:
    tube_lens_mm: 180
    inverted_objective: true
  plate_reader:
    rows: 8
    columns: 12
    row_spacing_mm: 9
    column_spacing_mm: 9
    offset_column_1_mm: 20
    offset_row_a_mm: 20
  wellplate_calibrations:
    "384":
      upper_left_x_mm: 12.41
      upper_left_y_mm: 11.18
      offset_x_mm: 0
      offset_y_mm: 0
