version: 3.0

# ============================================================
# DEVICES -- declarative hardware inventory
# ============================================================

devices:

  teensy:
    driver: teensy
    config:
      illumination_intensity_factor: 0.6
      output_gains:
        refdiv: false
        channels: [false, false, false, false, false, false, false, true]

  nidaq:
    driver: nidaq
    config:
      device_name: "Dev1"
      sample_rate: 100000

  main_camera:
    driver: toupcam
    role: main
    io:
      trigger:
        controller: teensy
        signal_type: digital
        direction: output
        channel_id: "trigger:0"
    config:
      model: "ITR3CMOS26000KMA"
      pixel_format: MONO16
      binning: 2
      roi: { offset_x: 0, offset_y: 0, width: 6224, height: 4168 }
      crop: { width: 4168, height: 4168 }
      rotate_angle: null
      flip: null
      temperature: 20

  focus_camera:
    driver: daheng
    role: focus
    config:
      model: "MER2-630-60U3M"
      exposure_time_ms: 0.8

  stage:
    driver: cephla
    controller: teensy
    config:
      x:
        fullsteps_per_rev: 200
        screw_pitch_mm: 2.54
        microstepping: 16
        motor_rms_current_ma: 1000
        i_hold: 0.25
        max_velocity_mm: 30
        max_acceleration_mm: 500
        movement_sign: 1
        pos_sign: 1
        homing_enabled: true
        home_switch_polarity: 1
        scan_stabilization_time_ms: 25
      y:
        fullsteps_per_rev: 200
        screw_pitch_mm: 2.54
        microstepping: 16
        motor_rms_current_ma: 1000
        i_hold: 0.25
        max_velocity_mm: 30
        max_acceleration_mm: 500
        movement_sign: 1
        pos_sign: 1
        homing_enabled: true
        home_switch_polarity: 1
        scan_stabilization_time_ms: 25
      z:
        fullsteps_per_rev: 200
        screw_pitch_mm: 0.3
        microstepping: 16
        motor_rms_current_ma: 500
        i_hold: 0.5
        max_velocity_mm: 3.8
        max_acceleration_mm: 100
        movement_sign: -1
        pos_sign: -1
        homing_enabled: true
        home_switch_polarity: 0
        scan_stabilization_time_ms: 20
        motor_config: stepper
      encoders:
        x: { enabled: false, has_encoder: false }
        y: { enabled: false, has_encoder: false }
        z: { enabled: false, has_encoder: false }
      pid:
        x: { enabled: false }
        y: { enabled: false }
        z: { enabled: false }
      software_limits:
        x: { positive: 115, negative: 5 }
        y: { positive: 76, negative: 4 }
        z: { positive: 6, negative: 0.05 }
      positions:
        loading: { x_mm: 0.5, y_mm: 0.5 }
        scanning: { x_mm: 20, y_mm: 20 }
        default_z_mm: 2.287

  illumination:
    driver: squid_builtin
    channels:
      405nm:
        wavelength_nm: 405
        io:
          intensity:
            controller: teensy
            signal_type: analog
            direction: output
            channel_id: "port:0"
          shutter:
            controller: teensy
            signal_type: digital
            direction: output
            channel_id: "port:0"
      488nm:
        wavelength_nm: 488
        io:
          intensity:
            controller: teensy
            signal_type: analog
            direction: output
            channel_id: "port:1"
          shutter:
            controller: teensy
            signal_type: digital
            direction: output
            channel_id: "port:1"
      561nm:
        wavelength_nm: 561
        io:
          intensity:
            controller: teensy
            signal_type: analog
            direction: output
            channel_id: "port:2"
          shutter:
            controller: teensy
            signal_type: digital
            direction: output
            channel_id: "port:2"
      638nm:
        wavelength_nm: 638
        io:
          intensity:
            controller: teensy
            signal_type: analog
            direction: output
            channel_id: "port:3"
          shutter:
            controller: teensy
            signal_type: digital
            direction: output
            channel_id: "port:3"
      730nm:
        wavelength_nm: 730
        io:
          intensity:
            controller: teensy
            signal_type: analog
            direction: output
            channel_id: "port:4"
          shutter:
            controller: teensy
            signal_type: digital
            direction: output
            channel_id: "port:4"

  laser_af:
    driver: laser_af
    enabled: true
    io:
      laser_gate:
        controller: teensy
        signal_type: digital
        direction: output
        channel_id: "pin:15"
    config:
      spot_detection_mode: dual_left

  piezo:
    driver: objective_piezo
    enabled: false
    io:
      output:
        controller: teensy
        signal_type: analog
        direction: output
        channel_id: "dac:7"
    config:
      range_um: 300
      home_um: 150
      control_voltage_range: 10
      flip_direction: false

illumination_channels_file: illumination_channel_config.yaml

software:
  is_hcs: true
  wellplate_format: 384
  default_saving_path: "/Downloads"
  display:
    default_crop: 85
    use_napari_for_live_view: false
    use_napari_for_mosaic: true
  acquisition:
    image_format: bmp
    scaling_factor: 0.85
    dx: 0.9
    dy: 0.9
    dz: 1.5
    fovs_per_af: 3
    flexible_multipoint: true
    wellplate_multipoint: false
    recording: true
    fast_acquisition: true
    default_nx: 1
    default_ny: 1
  autofocus:
    channel: "BF LED matrix full"
    enable_by_default: false
    bf_saving_option: "Green Channel Only"
    stop_threshold: 0.85
    crop_width: 800
    crop_height: 800
  tracking:
    enabled: false
    default_tracker: csrt
  optics:
    tube_lens_mm: 180
    inverted_objective: true
  plate_reader:
    rows: 8
    columns: 12
    row_spacing_mm: 9
    column_spacing_mm: 9
    offset_column_1_mm: 20
    offset_row_a_mm: 20
  wellplate_calibrations:
    "384":
      upper_left_x_mm: 12.41
      upper_left_y_mm: 11.18
      offset_x_mm: 0
      offset_y_mm: 0

