# Wellplate / sample-holder format definitions.
#
# Plate-intrinsic geometry only — these values describe the physical sample
# holder and are the same for every machine. Per-machine stage calibration
# (where the stage finds A1 in its own coordinate frame) lives in
# machine_config.yaml under `wellplate_calibrations:`.
#
# Coordinate system for plate-intrinsic values:
#   Origin = physical top-left corner of the sample holder (viewed from above,
#   with column 1 on the left and row A at the top).
#   +x = toward higher column numbers; +y = toward higher row letters.
#   All distances in millimeters.
#
# `a1_offset_mm`: XY position of the A1 well CENTER measured from that origin.
# `plate_dimensions_mm`: outer bounding box [width, height].
# `well.shape`: "circle" or "rectangle".
#   - circle: specify `diameter_mm`.
#   - rectangle: specify `width_mm`, `height_mm`, optional `corner_radius_mm`.
# `grid.row_spacing_mm` / `col_spacing_mm`: center-to-center pitch; independent
#   so non-square pitches are supported.
# `number_of_skip`: number of rows/columns on every edge that are unusable
#   (e.g. 384 well plates with skipped outer wells).
# `plate_corner_radius_mm` / `a1_chamfer`: visual only (map rendering).

formats:

  - id: "glass slide"
    display_name: "Glass Slide"
    plate_dimensions_mm: [75.0, 25.0]
    plate_corner_radius_mm: 1.0
    a1_chamfer: false
    a1_offset_mm: [37.5, 12.5]
    grid:
      rows: 1
      cols: 1
      row_spacing_mm: 0.0
      col_spacing_mm: 0.0
    well:
      shape: rectangle
      width_mm: 50.0
      height_mm: 18.0
      corner_radius_mm: 0.0
    number_of_skip: 0

